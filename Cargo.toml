[package]
name = "lan-message"
version = "0.0.1"
authors = ["cnfalcon@qq.com"]
description = "LAN communication software."
repository = "https://github.com/ZhouShaoYuan/lan-message"
documentation = "https://github.com/ZhouShaoYuan/lan-message"
keywords = ["LANMessage", "ipmsg"]
license = "MIT"
edition = "2021"

[[bin]]
name = "LANMessage"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
hostname = "0.3"
encoding = "0.2"
#lazy_static = "1"
log = "0.4"
env_logger = "0.10"
anyhow = "1"
thiserror = "1.0"
crossbeam-channel = "0.5"
combine = "4"
once_cell="1.19"
human-panic = "2.0.8"
local-ip-address = "0.6.12"
async-channel = "2.1"

eframe = "0.30"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
xcap = "0.9"
image = "0.25"
screenshots = "0.7"
